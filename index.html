<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RODON</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08090c;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#gameWrap{
    position:relative;
    width:min(1280px,100vw);
    aspect-ratio:16/9;
    max-height:100vh;
    background:#101218;
    overflow:hidden;
    border:2px solid #292d36;
    box-shadow:0 0 35px #000;
}

canvas{
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
    cursor:crosshair;
}

#version{
    position:absolute;
    bottom:8px;
    right:10px;
    color:#777;
    font-size:12px;
    pointer-events:none;
}

.screen{
    position:absolute;
    inset:0;
    display:none;
    background:
        radial-gradient(circle at center,#252833 0,#101218 48%,#07080a 100%);
}

.screen.active{
    display:flex;
}

.menu{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
}

.logo{
    font-size:72px;
    font-weight:900;
    letter-spacing:14px;
    color:#ddd;
    text-shadow:5px 5px 0 #18191e,0 0 30px #555;
}

.subtitle{
    color:#777;
    letter-spacing:5px;
    margin-bottom:22px;
}

button{
    min-width:240px;
    min-height:46px;
    padding:10px 18px;
    border:1px solid #555;
    background:#171a20;
    color:#eee;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.12s;
}

button:hover{
    background:#292e37;
    border-color:#aaa;
    transform:translateY(-1px);
}

button:active{
    transform:translateY(1px);
}

.smallBtn{
    min-width:130px;
}

.panel{
    width:min(1050px,92%);
    max-height:88%;
    overflow:auto;
    padding:25px;
    background:rgba(13,15,19,.96);
    border:2px solid #343943;
    box-shadow:0 15px 45px #000;
}

.panel h1{
    margin:0 0 18px;
    text-align:center;
    letter-spacing:4px;
}

.panel h2{
    color:#bbb;
    border-bottom:1px solid #333;
    padding-bottom:8px;
}

.closeRow{
    display:flex;
    justify-content:center;
    margin-top:20px;
}

.update{
    padding:16px;
    margin:12px 0;
    background:#171a20;
    border-left:4px solid #777;
}

.update.latest{
    border-left-color:#ddd;
}

.updateTop{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
}

.updateVersion{
    font-weight:900;
    color:#fff;
}

.latestTag{
    color:#111;
    background:#ddd;
    padding:3px 7px;
    font-size:11px;
    font-weight:bold;
}

.updateTitle{
    margin-top:7px;
    font-size:18px;
    font-weight:bold;
}

.updateDate{
    color:#777;
    font-size:12px;
}

.updateBody{
    color:#bbb;
    margin-top:8px;
    line-height:1.5;
}

.tabs{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

.tab{
    min-width:180px;
}

.tab.active{
    background:#ddd;
    color:#111;
}

.rarityGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.rarityCard{
    padding:15px;
    background:#171a20;
    border:1px solid #333;
}

.rarityName{
    font-weight:bold;
    font-size:18px;
}

.common{color:#aaa}
.uncommon{color:#65d46e}
.rare{color:#55aaff}
.epic{color:#bb70ff}
.legendary{color:#ffae45}
.mythic{color:#ff4e4e}

.itemList{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:10px;
}

.itemCard{
    padding:12px;
    background:#171a20;
    border:1px solid #30343c;
}

.stat{
    color:#999;
    font-size:13px;
    margin-top:4px;
}

#message{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    padding:9px 16px;
    background:rgba(0,0,0,.75);
    border:1px solid #444;
    color:#eee;
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

#message.show{
    opacity:1;
}

#lootButtons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.reward{
    text-align:center;
    padding:20px;
    margin:10px;
    background:#171a20;
    border:1px solid #444;
}

.rewardName{
    font-size:23px;
    font-weight:bold;
}

.controls{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    color:#aaa;
    line-height:1.5;
}

@media(max-width:700px){
    .logo{font-size:42px;letter-spacing:7px}
    .rarityGrid{grid-template-columns:1fr}
    .controls{grid-template-columns:1fr}
    button{min-width:190px}
}
</style>
</head>

<body>

<div id="gameWrap">

<canvas id="game" width="1280" height="720"></canvas>

<div id="version"></div>
<div id="message"></div>

<!-- START -->
<div id="start" class="screen active">
    <div class="menu">
        <div class="logo">RODON</div>
        <div class="subtitle">DARK MEDIEVAL ADVENTURE</div>

        <button onclick="startGame('story')">STORY MODE</button>
        <button onclick="startGame('infinite')">INFINITE MODE</button>
        <button onclick="openScreen('rarity')">RARITIES</button>
        <button onclick="openScreen('updates')">UPDATE BOARD</button>
        <button onclick="openScreen('credits')">CREDITS</button>
    </div>
</div>

<!-- PAUSE -->
<div id="pause" class="screen">
    <div class="menu">
        <h1>PAUSED</h1>
        <button onclick="resumeGame()">RESUME</button>
        <button onclick="openScreen('updates')">UPDATE BOARD</button>
        <button onclick="openScreen('rarity')">RARITIES</button>
        <button onclick="openScreen('start')">MAIN MENU</button>
    </div>
</div>

<!-- UPDATES -->
<div id="updates" class="screen">
    <div class="panel">
        <h1>UPDATE BOARD</h1>
        <div id="updatesList"></div>

        <div class="closeRow">
            <button onclick="closeUpdates()">CLOSE</button>
        </div>
    </div>
</div>

<!-- RARITY -->
<div id="rarity" class="screen">
    <div class="panel">
        <h1>RARITY GUIDE</h1>

        <div class="tabs">
            <button id="weaponTab" class="tab active" onclick="showRarityTab('weapons')">
                WEAPONS
            </button>

            <button id="armorTab" class="tab" onclick="showRarityTab('armor')">
                ARMOR
            </button>
        </div>

        <div id="rarityContent"></div>

        <div class="closeRow">
            <button onclick="closeRarity()">CLOSE</button>
        </div>
    </div>
</div>

<!-- CREDITS -->
<div id="credits" class="screen">
    <div class="menu">
        <h1>RODON</h1>
        <p>Dark Medieval Adventure RPG</p>
        <p style="color:#777">Built as a browser game.</p>
        <button onclick="openScreen('start')">BACK</button>
    </div>
</div>

<!-- CHARACTER -->
<div id="character" class="screen">
    <div class="panel">
        <h1>CHARACTER</h1>
        <div id="characterInfo"></div>
        <div class="closeRow">
            <button onclick="closePanel()">CLOSE</button>
        </div>
    </div>
</div>

<!-- INVENTORY -->
<div id="inventory" class="screen">
    <div class="panel">
        <h1>INVENTORY</h1>
        <div id="inventoryList" class="itemList"></div>
        <div class="closeRow">
            <button onclick="closePanel()">CLOSE</button>
        </div>
    </div>
</div>

<!-- MAP -->
<div id="map" class="screen">
    <div class="panel">
        <h1>MAP</h1>
        <div id="mapInfo"></div>
        <div class="closeRow">
            <button onclick="closePanel()">CLOSE</button>
        </div>
    </div>
</div>

<!-- LOOT -->
<div id="loot" class="screen">
    <div class="panel">
        <h1>LOOT</h1>
        <div id="lootList" class="itemList"></div>

        <div id="lootButtons" style="margin-top:20px">
            <button onclick="takeAll()">TAKE ALL</button>
            <button onclick="closeLoot()">CLOSE</button>
        </div>
    </div>
</div>

<!-- CHEST -->
<div id="chestReward" class="screen">
    <div class="panel">
        <h1>CHEST OPENED</h1>
        <div id="chestRewardList"></div>

        <div class="closeRow">
            <button onclick="closeChestReward()">CONTINUE</button>
        </div>
    </div>
</div>

<!-- VICTORY -->
<div id="victory" class="screen">
    <div class="menu">
        <h1>VICTORY</h1>
        <p>The King of Rodon has fallen.</p>
        <button onclick="openScreen('start')">MAIN MENU</button>
    </div>
</div>

<!-- DEATH -->
<div id="death" class="screen">
    <div class="menu">
        <h1>YOU DIED</h1>
        <button onclick="restartGame()">TRY AGAIN</button>
        <button onclick="openScreen('start')">MAIN MENU</button>
    </div>
</div>

</div>

<script>
"use strict";

/* =========================================================
   RODON VERSION / UPDATE BOARD
   IMPORTANT:
   Every time the game is changed, add the newest update
   to the TOP of this array and increase GAME_VERSION.
   Never delete previous entries.
   ========================================================= */

const GAME_VERSION = "1.2.0";

const UPDATES = [
    {
        version:"1.2.0",
        date:"September 30, 2026",
        title:"Movement, Room Transitions + Mouse Combat Fixes",
        body:
        "Fixed WASD and arrow-key movement, improved doorway detection and room transitions, prevented doorway bouncing, fixed mouse aiming when the canvas is scaled, made the warrior face the mouse, and repaired left-click attacks and right-click abilities."
    },
    {
        version:"1.1.0",
        date:"September 2026",
        title:"GitHub Pages Gameplay Repair",
        body:
        "Repaired the browser build so the main game systems work correctly when hosted through GitHub Pages."
    },
    {
        version:"1.0.0",
        date:"September 2026",
        title:"Starter Weapon + Rarity Guide",
        body:
        "Added the guaranteed first chest weapon, rarity system, weapon rarity guide, and separate rarity categories."
    },
    {
        version:"0.9.0",
        date:"September 2026",
        title:"Updates Close Button",
        body:
        "Added a working close button to the Updates screen that returns to the main menu."
    },
    {
        version:"0.8.0",
        date:"September 2026",
        title:"1–2 Body Drops + Rarity Colors",
        body:
        "Normal enemies can now drop 1–2 loot items and item names use rarity colors."
    },
    {
        version:"0.7.0",
        date:"September 2026",
        title:"Fresh Start",
        body:
        "Reset and rebuilt the core RODON gameplay systems."
    },
    {
        version:"0.6.0",
        date:"September 2026",
        title:"One-Second Screen Shake",
        body:
        "Added short combat screen-shake feedback."
    },
    {
        version:"0.5.0",
        date:"September 2026",
        title:"Random Loot + Updates Board",
        body:
        "Added random loot generation and the first Update Board."
    },
    {
        version:"0.4.0",
        date:"September 2026",
        title:"Story + Infinite Modes",
        body:
        "Added Story Mode and Infinite Mode."
    },
    {
        version:"0.3.0",
        date:"September 2026",
        title:"Retro Pixel Pass",
        body:
        "Improved the visual style with a dark retro pixel-art direction."
    },
    {
        version:"0.2.0",
        date:"September 2026",
        title:"Movement Fix",
        body:
        "Improved player movement."
    },
    {
        version:"0.1.0",
        date:"September 2026",
        title:"RODON Prototype",
        body:
        "Initial RODON prototype."
    }
];

/* =========================================================
   CANVAS
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = canvas.width;
const H = canvas.height;

document.getElementById("version").textContent = "v" + GAME_VERSION;

/* =========================================================
   GAME DATA
   ========================================================= */

const rarities = [
    {name:"Common",className:"common",mult:1},
    {name:"Uncommon",className:"uncommon",mult:1.25},
    {name:"Rare",className:"rare",mult:1.6},
    {name:"Epic",className:"epic",mult:2.1},
    {name:"Legendary",className:"legendary",mult:3},
    {name:"Mythic",className:"mythic",mult:4.5}
];

const weaponTypes = [
    "Iron Sword",
    "Knight Sword",
    "Rusty Katana",
    "Shadow Dagger",
    "War Mace",
    "Battle Axe",
    "Long Spear",
    "Hunter Bow",
    "Dark Staff"
];

const armorTypes = [
    "Leather Armor",
    "Iron Armor",
    "Steel Armor",
    "Knight Armor",
    "Shadow Armor",
    "Dragon Armor"
];

const enemyTypes = [
    {name:"Slime",hp:45,damage:8,speed:45,color:"#5d9b55"},
    {name:"Goblin",hp:65,damage:12,speed:55,color:"#698c52"},
    {name:"Wolf",hp:80,damage:15,speed:90,color:"#777"},
    {name:"Skeleton",hp:95,damage:17,speed:48,color:"#bbb"},
    {name:"Zombie",hp:120,damage:20,speed:35,color:"#61745b"},
    {name:"Bandit",hp:140,damage:22,speed:65,color:"#795d4d"},
    {name:"Orc",hp:220,damage:30,speed:42,color:"#526e4e"},
    {name:"Spider",hp:100,damage:19,speed:75,color:"#40353f"},
    {name:"Dark Knight",hp:360,damage:42,speed:38,color:"#343943"},
    {name:"Mage",hp:190,damage:34,speed:42,color:"#634d78"},
    {name:"Giant",hp:600,damage:55,speed:28,color:"#55463d"}
];

const rooms = [
    {name:"Rodon Village",level:1,enemies:2},
    {name:"Whispering Forest",level:2,enemies:4},
    {name:"Deep Forest",level:3,enemies:5},
    {name:"Shadow Grove",level:4,enemies:6},
    {name:"Ancient Cave",level:5,enemies:7},
    {name:"Crystal Cavern",level:6,enemies:8},
    {name:"Forgotten Ruins",level:7,enemies:8},
    {name:"Ruined Castle",level:8,enemies:9},
    {name:"King's Arena",level:9,enemies:10},
    {name:"Throne of Rodon",level:10,boss:true,enemies:1}
];

const state = {
    screen:"start",
    gameStarted:false,
    mode:"story",
    roomIndex:0,
    room:null,
    enemies:[],
    loot:[],
    chestOpened:false,
    firstChestUsed:false,
    chestReward:[],
    inventory:[],
    equippedWeapon:null,
    equippedArmor:null,
    player:null,
    keys:{},
    mouse:{x:W/2,y:H/2,down:false,right:false},
    lastTime:0,
    attackCooldown:0,
    abilityCooldown:0,
    transitionCooldown:0,
    invuln:0,
    shake:0,
    rarityTab:"weapons",
    infiniteWave:1
};

/* =========================================================
   PLAYER
   ========================================================= */

function defaultPlayer(){
    return {
        x:W/2,
        y:H/2,
        radius:24,
        hp:250,
        maxHp:250,
        baseDamage:32,
        speed:220,
        armor:0,
        facing:0
    };
}

/* =========================================================
   UTILITIES
   ========================================================= */

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function random(min,max){
    return Math.random()*(max-min)+min;
}

function randomInt(min,max){
    return Math.floor(random(min,max+1));
}

function distance(a,b){
    return Math.hypot(a.x-b.x,a.y-b.y);
}

function randomChoice(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function rarityClass(name){
    const r=rarities.find(x=>x.name===name);
    return r ? r.className : "common";
}

function rarityMultiplier(name){
    const r=rarities.find(x=>x.name===name);
    return r ? r.mult : 1;
}

function showMessage(text){
    const el=document.getElementById("message");
    el.textContent=text;
    el.classList.add("show");

    clearTimeout(showMessage.timer);

    showMessage.timer=setTimeout(()=>{
        el.classList.remove("show");
    },1400);
}

/* =========================================================
   LOOT
   ========================================================= */

function randomRarity(){
    const roll=Math.random();

    if(roll<0.58) return "Common";
    if(roll<0.82) return "Uncommon";
    if(roll<0.94) return "Rare";
    if(roll<0.985) return "Epic";
    if(roll<0.998) return "Legendary";
    return "Mythic";
}

/*
   The first Story Mode chest always contains exactly one weapon.
   Epic, Legendary and Mythic are extremely rare.
*/
function firstChestRarity(){
    const roll=Math.random();

    if(roll<0.72) return "Common";
    if(roll<0.94) return "Uncommon";
    if(roll<0.987) return "Rare";
    if(roll<0.998) return "Epic";
    if(roll<0.9997) return "Legendary";
    return "Mythic";
}

function makeWeapon(rarity=null){
    rarity=rarity||randomRarity();

    const mult=rarityMultiplier(rarity);

    return {
        id:crypto.randomUUID(),
        type:"weapon",
        name:randomChoice(weaponTypes),
        rarity,
        damage:Math.round((random(22,42))*mult)
    };
}

function makeArmor(rarity=null){
    rarity=rarity||randomRarity();

    const mult=rarityMultiplier(rarity);

    return {
        id:crypto.randomUUID(),
        type:"armor",
        name:randomChoice(armorTypes),
        rarity,
        armor:Math.round(random(8,22)*mult)
    };
}

function makePotion(){
    return {
        id:crypto.randomUUID(),
        type:"potion",
        name:"Health Potion",
        rarity:"Common",
        heal:60
    };
}

function bodyLoot(){
    const amount=randomInt(1,2);
    const result=[];

    for(let i=0;i<amount;i++){
        const roll=Math.random();

        if(roll<.58){
            result.push(makeWeapon());
        }else if(roll<.88){
            result.push(makeArmor());
        }else{
            result.push(makePotion());
        }
    }

    return result;
}

function chestLoot(){
    return [
        makeWeapon(),
        Math.random()<.5 ? makeArmor() : makePotion()
    ];
}

/* =========================================================
   PLAYER STATS
   ========================================================= */

function derivedStats(){
    const armor=state.equippedArmor ? state.equippedArmor.armor : 0;
    const damage=state.equippedWeapon ?
        state.equippedWeapon.damage :
        state.player.baseDamage;

    return {
        armor,
        damage
    };
}

/* =========================================================
   ROOMS
   ========================================================= */

function loadRoom(index){
    index=clamp(index,0,rooms.length-1);

    state.roomIndex=index;
    state.room=rooms[index];

    state.player.x=W/2;
    state.player.y=H/2;

    state.loot=[];
    state.chestReward=[];

    state.enemies=[];

    if(state.room.boss){
        spawnEnemy("Dark Knight",W-180,H/2,true);
    }else{
        for(let i=0;i<state.room.enemies;i++){
            spawnEnemy();
        }
    }

    state.transitionCooldown=.8;
}

function spawnEnemy(typeName=null,x=null,y=null,boss=false){
    let type;

    if(typeName){
        type=enemyTypes.find(e=>e.name===typeName)||enemyTypes[0];
    }else{
        const available=enemyTypes.slice(
            0,
            Math.min(enemyTypes.length,3+state.roomIndex)
        );

        type=randomChoice(available);
    }

    const level=state.roomIndex+1;
    const multiplier=1+(level-1)*.16;

    const enemy={
        id:crypto.randomUUID(),
        name:type.name,
        x:x===null?random(120,W-120):x,
        y:y===null?random(110,H-110):y,
        radius:boss?40:22,
        hp:Math.round(type.hp*multiplier*(boss?1.8:1)),
        maxHp:Math.round(type.hp*multiplier*(boss?1.8:1)),
        damage:Math.round(type.damage*multiplier*(boss?1.25:1)),
        speed:type.speed,
        color:type.color,
        boss
    };

    state.enemies.push(enemy);
}

/* =========================================================
   GAME START / SCREEN MANAGEMENT
   ========================================================= */

function startGame(mode){
    if(mode==="infinite" && !localStorage.getItem("rodonStoryComplete")){
        showMessage("Defeat the King of Rodon first.");
        return;
    }

    state.mode=mode;
    state.gameStarted=true;
    state.player=defaultPlayer();
    state.inventory=[];
    state.equippedWeapon=null;
    state.equippedArmor=null;
    state.firstChestUsed=false;
    state.infiniteWave=1;

    loadRoom(0);

    hideAllScreens();
}

function restartGame(){
    startGame(state.mode);
}

function resumeGame(){
    hideAllScreens();
    state.screen="game";
}

function openScreen(name){
    hideAllScreens();

    const el=document.getElementById(name);

    if(el){
        el.classList.add("active");
        state.screen=name;
    }

    if(name==="updates"){
        renderUpdates();
    }

    if(name==="rarity"){
        renderRarity();
    }

    if(name==="character"){
        renderCharacter();
    }

    if(name==="inventory"){
        renderInventory();
    }

    if(name==="map"){
        renderMap();
    }
}

function hideAllScreens(){
    document.querySelectorAll(".screen").forEach(x=>{
        x.classList.remove("active");
    });
}

function closeUpdates(){
    /*
      Updates intentionally return to the main menu.
    */
    state.gameStarted=false;
    state.screen="start";
    openScreen("start");
}

function closeRarity(){
    state.gameStarted=false;
    state.screen="start";
    openScreen("start");
}

function closePanel(){
    hideAllScreens();

    if(state.gameStarted){
        state.screen="game";
    }else{
        openScreen("start");
    }
}

function closeLoot(){
    openScreen("game");
}

function closeChestReward(){
    openScreen("game");
}

/* =========================================================
   UPDATE BOARD
   ========================================================= */

function renderUpdates(){
    const list=document.getElementById("updatesList");

    list.innerHTML=UPDATES.map((u,i)=>`
        <div class="update ${i===0?"latest":""}">
            <div class="updateTop">
                <div>
                    <span class="updateVersion">v${u.version}</span>
                    ${i===0?'<span class="latestTag">LATEST</span>':""}
                </div>
                <div class="updateDate">${u.date}</div>
            </div>

            <div class="updateTitle">${u.title}</div>

            <div class="updateBody">${u.body}</div>
        </div>
    `).join("");
}

/* =========================================================
   RARITY GUIDE
   ========================================================= */

function showRarityTab(tab){
    state.rarityTab=tab;

    document.getElementById("weaponTab")
        .classList.toggle("active",tab==="weapons");

    document.getElementById("armorTab")
        .classList.toggle("active",tab==="armor");

    renderRarity();
}

function renderRarity(){
    const content=document.getElementById("rarityContent");

    content.innerHTML=`
        <div class="rarityGrid">
            ${rarities.map(r=>`
                <div class="rarityCard">
                    <div class="rarityName ${r.className}">
                        ${r.name}
                    </div>

                    <div class="stat">
                        ${state.rarityTab==="weapons"
                            ?"Weapon damage multiplier: "
                            :"Armor protection multiplier: "}
                        x${r.mult}
                    </div>
                </div>
            `).join("")}
        </div>
    `;
}

/* =========================================================
   INVENTORY
   ========================================================= */

function renderInventory(){
    const list=document.getElementById("inventoryList");

    if(!state.inventory.length){
        list.innerHTML="<p>Your inventory is empty.</p>";
        return;
    }

    list.innerHTML=state.inventory.map(item=>{
        const equipped=
            state.equippedWeapon?.id===item.id ||
            state.equippedArmor?.id===item.id;

        let stats="";

        if(item.type==="weapon"){
            stats=`Damage: ${item.damage}`;
        }else if(item.type==="armor"){
            stats=`Armor: ${item.armor}`;
        }else{
            stats=`Heals: ${item.heal}`;
        }

        return `
            <div class="itemCard">
                <div class="${rarityClass(item.rarity)}">
                    <strong>${item.name}</strong>
                </div>

                <div class="stat">
                    ${item.rarity}
                </div>

                <div class="stat">
                    ${stats}
                </div>

                <button
                    class="smallBtn"
                    style="margin-top:8px"
                    onclick="useInventoryItem('${item.id}')">
                    ${equipped?"EQUIPPED":"USE / EQUIP"}
                </button>
            </div>
        `;
    }).join("");
}

function useInventoryItem(id){
    const item=state.inventory.find(x=>x.id===id);

    if(!item)return;

    if(item.type==="weapon"){
        state.equippedWeapon=item;
        showMessage("Weapon equipped.");
    }

    if(item.type==="armor"){
        state.equippedArmor=item;
        showMessage("Armor equipped.");
    }

    if(item.type==="potion"){
        state.player.hp=clamp(
            state.player.hp+item.heal,
            0,
            state.player.maxHp
        );

        state.inventory=state.inventory.filter(x=>x.id!==id);

        showMessage("Health restored.");
    }

    renderInventory();
}

/* =========================================================
   CHARACTER
   ========================================================= */

function renderCharacter(){
    const stats=derivedStats();

    document.getElementById("characterInfo").innerHTML=`
        <div class="itemList">
            <div class="itemCard">
                <strong>WARRIOR</strong>
                <div class="stat">Health: ${Math.round(state.player.hp)} / ${state.player.maxHp}</div>
                <div class="stat">Damage: ${stats.damage}</div>
                <div class="stat">Armor: ${stats.armor}</div>
                <div class="stat">Speed: ${state.player.speed}</div>
            </div>

            <div class="itemCard">
                <strong>EQUIPMENT</strong>
                <div class="stat">
                    Weapon:
                    ${state.equippedWeapon
                        ? state.equippedWeapon.name
                        : "None"}
                </div>

                <div class="stat">
                    Armor:
                    ${state.equippedArmor
                        ? state.equippedArmor.name
                        : "None"}
                </div>
            </div>
        </div>
    `;
}

/* =========================================================
   MAP
   ========================================================= */

function renderMap(){
    document.getElementById("mapInfo").innerHTML=`
        <div class="itemList">
            ${rooms.map((r,i)=>`
                <div class="itemCard">
                    <strong>${i+1}. ${r.name}</strong>
                    <div class="stat">
                        ${i===state.roomIndex?"CURRENT ROOM":"Room"}
                    </div>

                    <div class="stat">
                        ${r.boss?"BOSS ROOM":"Enemy Level "+r.level}
                    </div>
                </div>
            `).join("")}
        </div>
    `;
}

/* =========================================================
   LOOT
   ========================================================= */

function openLoot(items){
    if(!items.length){
        showMessage("No loot.");
        return;
    }

    state.loot=items;

    document.getElementById("lootList").innerHTML=
        items.map(item=>`
            <div class="itemCard">
                <div class="${rarityClass(item.rarity)}">
                    <strong>${item.name}</strong>
                </div>

                <div class="stat">
                    ${item.rarity}
                </div>

                <div class="stat">
                    ${item.type==="weapon"
                        ?`Damage: ${item.damage}`
                        :item.type==="armor"
                            ?`Armor: ${item.armor}`
                            :`Heals: ${item.heal}`}
                </div>

                <button
                    class="smallBtn"
                    style="margin-top:8px"
                    onclick="takeLoot('${item.id}')">
                    TAKE
                </button>
            </div>
        `).join("");

    openScreen("loot");
}

function takeLoot(id){
    const item=state.loot.find(x=>x.id===id);

    if(!item)return;

    state.inventory.push(item);
    state.loot=state.loot.filter(x=>x.id!==id);

    showMessage(item.name+" added.");

    if(!state.loot.length){
        closeLoot();
    }else{
        openLoot(state.loot);
    }
}

function takeAll(){
    state.inventory.push(...state.loot);
    state.loot=[];

    showMessage("Loot collected.");
    closeLoot();
}

/* =========================================================
   CHESTS
   ========================================================= */

function openChest(){
    if(state.chestOpened){
        showMessage("Chest already opened.");
        return;
    }

    state.chestOpened=true;

    let rewards;

    /*
      Story Mode first chest:
      exactly ONE weapon.
    */
    if(
        state.mode==="story" &&
        state.roomIndex===0 &&
        !state.firstChestUsed
    ){
        rewards=[
            makeWeapon(firstChestRarity())
        ];

        state.firstChestUsed=true;
    }else{
        rewards=chestLoot();
    }

    state.inventory.push(...rewards);
    state.chestReward=rewards;

    renderChestRewards();
    openScreen("chestReward");
}

function renderChestRewards(){
    const el=document.getElementById("chestRewardList");

    el.innerHTML=state.chestReward.map(item=>`
        <div class="reward">
            <div class="${rarityClass(item.rarity)} rewardName">
                ${item.name}
            </div>

            <div style="margin-top:8px">
                ${item.rarity}
            </div>

            <div class="stat">
                ${item.type==="weapon"
                    ?`Damage: ${item.damage}`
                    :item.type==="armor"
                        ?`Armor: ${item.armor}`
                        :`Heals: ${item.heal}`}
            </div>
        </div>
    `).join("");
}

/* =========================================================
   COMBAT
   ========================================================= */

function attack(){
    if(!state.gameStarted)return;
    if(state.attackCooldown>0)return;

    state.attackCooldown=.25;

    const stats=derivedStats();

    let nearest=null;
    let nearestDistance=Infinity;

    for(const enemy of state.enemies){
        const d=distance(state.player,enemy);

        if(d<nearestDistance){
            nearest=enemy;
            nearestDistance=d;
        }
    }

    if(nearest && nearestDistance<90){
        nearest.hp-=stats.damage;
        state.shake=5;

        if(nearest.hp<=0){
            killEnemy(nearest);
        }

        return;
    }

    showMessage("Attack missed.");
}

function ability(){
    if(!state.gameStarted)return;
    if(state.abilityCooldown>0)return;

    state.abilityCooldown=3;

    const stats=derivedStats();

    let hit=false;

    for(const enemy of [...state.enemies]){
        if(distance(state.player,enemy)<170){
            enemy.hp-=Math.round(stats.damage*2.2);
            hit=true;

            if(enemy.hp<=0){
                killEnemy(enemy);
            }
        }
    }

    state.shake=12;

    if(hit){
        showMessage("Dark Slash!");
    }else{
        showMessage("Dark Slash missed.");
    }
}

function killEnemy(enemy){
    const index=state.enemies.indexOf(enemy);

    if(index!==-1){
        state.enemies.splice(index,1);
    }

    if(enemy.boss){
        localStorage.setItem("rodonStoryComplete","1");
        showMessage("The King has fallen!");
        setTimeout(()=>{
            openScreen("victory");
        },500);
        return;
    }

    const loot=bodyLoot();

    if(loot.length){
        openLoot(loot);
    }

    if(state.mode==="infinite" && state.enemies.length===0){
        state.infiniteWave++;

        setTimeout(()=>{
            spawnInfiniteWave();
        },700);
    }
}

function spawnInfiniteWave(){
    state.chestOpened=false;

    const count=2+state.infiniteWave;

    for(let i=0;i<count;i++){
        spawnEnemy();
    }

    showMessage("Wave "+state.infiniteWave);
}

/* =========================================================
   ENEMY AI
   ========================================================= */

function updateEnemies(dt){
    if(!state.gameStarted)return;

    const stats=derivedStats();

    for(const enemy of state.enemies){
        const dx=state.player.x-enemy.x;
        const dy=state.player.y-enemy.y;

        const d=Math.hypot(dx,dy)||1;

        if(d>48){
            enemy.x+=(dx/d)*enemy.speed*dt;
            enemy.y+=(dy/d)*enemy.speed*dt;
        }else if(state.invuln<=0){
            const damage=Math.max(
                1,
                enemy.damage-Math.floor(stats.armor*.6)
            );

            state.player.hp-=damage;
            state.invuln=.55;
            state.shake=7;

            showMessage("-"+damage+" HP");

            if(state.player.hp<=0){
                state.player.hp=0;
                openScreen("death");
            }
        }

        enemy.x=clamp(enemy.x,45,W-45);
        enemy.y=clamp(enemy.y,75,H-45);
    }
}

/* =========================================================
   ROOM TRANSITIONS
   ========================================================= */

function transitionRooms(){
    if(state.transitionCooldown>0)return;

    if(state.player.x<15 && state.roomIndex>0){
        loadRoom(state.roomIndex-1);
        state.player.x=W-60;
        return;
    }

    if(state.player.x>W-15 && state.roomIndex<rooms.length-1){
        loadRoom(state.roomIndex+1);
        state.player.x=60;
        return;
    }
}

/* =========================================================
   INPUT
   ========================================================= */

window.addEventListener("keydown",e=>{
    const key=e.key.toLowerCase();

    state.keys[key]=true;

    if(
        ["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright",
        " ","f","e","m","i","c","u","escape"].includes(key)
    ){
        e.preventDefault();
    }

    if(key==="escape"){
        if(state.gameStarted){
            openScreen("pause");
        }
    }

    if(key==="m" && state.gameStarted){
        openScreen("map");
    }

    if(key==="i" && state.gameStarted){
        openScreen("inventory");
    }

    if(key==="c" && state.gameStarted){
        openScreen("character");
    }

    if(key==="u"){
        openScreen("updates");
    }

    if(key==="f" && state.gameStarted){
        tryInteract();
    }

    if(key==="e" && state.gameStarted){
        tryInteract();
    }

    if(key===" " && state.gameStarted){
        ability();
    }
});

window.addEventListener("keyup",e=>{
    state.keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("mousemove",e=>{
    const rect=canvas.getBoundingClientRect();

    state.mouse.x=
        (e.clientX-rect.left)*(W/rect.width);

    state.mouse.y=
        (e.clientY-rect.top)*(H/rect.height);

    if(state.player){
        state.player.facing=Math.atan2(
            state.mouse.y-state.player.y,
            state.mouse.x-state.player.x
        );
    }
});

canvas.addEventListener("mousedown",e=>{
    if(e.button===0){
        state.mouse.down=true;
        attack();
    }

    if(e.button===2){
        state.mouse.right=true;
        ability();
    }
});

canvas.addEventListener("mouseup",e=>{
    if(e.button===0)state.mouse.down=false;
    if(e.button===2)state.mouse.right=false;
});

canvas.addEventListener("contextmenu",e=>{
    e.preventDefault();
});

function tryInteract(){
    if(!state.gameStarted)return;

    /*
      For the first room, the chest is located near the top.
    */
    const chest={
        x:W/2,
        y:115
    };

    if(
        state.roomIndex===0 &&
        distance(state.player,chest)<75
    ){
        openChest();
        return;
    }

    for(const enemy of state.enemies){
        if(distance(state.player,enemy)<70){
            attack();
            return;
        }
    }
}

/* =========================================================
   UPDATE GAME
   ========================================================= */

function update(dt){
    if(!state.gameStarted)return;
    if(state.screen!=="game")return;

    state.attackCooldown=Math.max(
        0,
        state.attackCooldown-dt
    );

    state.abilityCooldown=Math.max(
        0,
        state.abilityCooldown-dt
    );

    state.transitionCooldown=Math.max(
        0,
        state.transitionCooldown-dt
    );

    state.invuln=Math.max(
        0,
        state.invuln-dt
    );

    state.shake=Math.max(
        0,
        state.shake-dt*30
    );

    const p=state.player;

    let dx=0;
    let dy=0;

    if(state.keys["w"]||state.keys["arrowup"])dy-=1;
    if(state.keys["s"]||state.keys["arrowdown"])dy+=1;
    if(state.keys["a"]||state.keys["arrowleft"])dx-=1;
    if(state.keys["d"]||state.keys["arrowright"])dx+=1;

    if(dx!==0||dy!==0){
        const length=Math.hypot(dx,dy);
        dx/=length;
        dy/=length;

        p.x+=dx*p.speed*dt;
        p.y+=dy*p.speed*dt;
    }

    p.x=clamp(p.x,10,W-10);
    p.y=clamp(p.y,55,H-10);

    if(state.mouse.down){
        attack();
    }

    if(state.mouse.right){
        ability();
    }

    transitionRooms();
    updateEnemies(dt);
}

/* =========================================================
   DRAWING
   ========================================================= */

function drawBackground(){
    const room=state.room;

    ctx.fillStyle="#111319";
    ctx.fillRect(0,0,W,H);

    /*
      Dark medieval pixel-art environment.
    */

    const gradient=ctx.createRadialGradient(
        W/2,H/2,50,
        W/2,H/2,650
    );

    gradient.addColorStop(0,"#292d2d");
    gradient.addColorStop(1,"#08090c");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="#171a1d";

    for(let x=0;x<W;x+=80){
        ctx.fillRect(x,65,2,H-65);
    }

    for(let y=80;y<H;y+=80){
        ctx.fillRect(0,y,W,2);
    }

    /*
      Decorative stones.
    */
    ctx.fillStyle="#25282b";

    for(let i=0;i<35;i++){
        const x=(i*173)%W;
        const y=80+((i*91)%(H-100));

        ctx.fillRect(x,y,24,8);
        ctx.fillRect(x+6,y+8,14,4);
    }

    ctx.fillStyle="#bbb";
    ctx.font="bold 22px Arial";
    ctx.fillText(room ? room.name : "RODON",25,38);

    ctx.fillStyle="#777";
    ctx.font="14px Arial";

    if(state.mode==="infinite"){
        ctx.fillText(
            "INFINITE WAVE "+state.infiniteWave,
            W-190,
            35
        );
    }
}

function drawDoorways(){
    ctx.fillStyle="#090a0d";

    if(state.roomIndex>0){
        ctx.fillRect(0,275,30,170);
    }

    if(state.roomIndex<rooms.length-1){
        ctx.fillRect(W-30,275,30,170);
    }

    ctx.fillStyle="#777";
    ctx.fillRect(8,280,6,160);
    ctx.fillRect(W-14,280,6,160);
}

function drawChest(){
    if(state.roomIndex!==0)return;
    if(state.chestOpened)return;

    const x=W/2;
    const y=115;

    ctx.fillStyle="#3b2617";
    ctx.fillRect(x-35,y-22,70,45);

    ctx.fillStyle="#71502c";
    ctx.fillRect(x-35,y-22,70,10);

    ctx.fillStyle="#d2a94f";
    ctx.fillRect(x-5,y-4,10,15);

    ctx.fillStyle="#aaa";
    ctx.font="13px Arial";
    ctx.fillText(
        "F / E - OPEN CHEST",
        x-65,
        y+48
    );
}

function drawPlayer(){
    const p=state.player;

    ctx.save();

    if(state.invuln>0){
        ctx.globalAlpha=.55;
    }

    /*
      Buff medieval warrior body.
    */

    // legs
    ctx.fillStyle="#292b30";
    ctx.fillRect(p.x-17,p.y+10,13,25);
    ctx.fillRect(p.x+4,p.y+10,13,25);

    // boots
    ctx.fillStyle="#17181c";
    ctx.fillRect(p.x-19,p.y+30,17,7);
    ctx.fillRect(p.x+2,p.y+30,17,7);

    // body armor
    if(state.equippedArmor){
        ctx.fillStyle=
            state.equippedArmor.rarity==="Mythic"
            ?"#7a2525"
            :"#555b63";
    }else{
        ctx.fillStyle="#343941";
    }

    ctx.fillRect(p.x-25,p.y-20,50,40);

    // shoulders
    ctx.fillRect(p.x-34,p.y-15,12,25);
    ctx.fillRect(p.x+22,p.y-15,12,25);

    // head
    ctx.fillStyle="#b58f72";
    ctx.fillRect(p.x-17,p.y-43,34,25);

    // helmet
    ctx.fillStyle="#24272d";
    ctx.fillRect(p.x-21,p.y-48,42,12);

    // face
    ctx.fillStyle="#17181b";
    ctx.fillRect(p.x+2,p.y-37,10,5);

    // weapon
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.facing);

    ctx.fillStyle="#17181b";
    ctx.fillRect(22,-5,43,9);

    ctx.fillStyle="#aaa";
    ctx.fillRect(52,-7,34,13);

    ctx.restore();

    ctx.restore();
}

function drawEnemy(enemy){
    ctx.save();

    const x=enemy.x;
    const y=enemy.y;

    // shadow
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.fillRect(
        x-enemy.radius,
        y+enemy.radius-4,
        enemy.radius*2,
        7
    );

    // body
    ctx.fillStyle=enemy.color;
    ctx.fillRect(
        x-enemy.radius,
        y-enemy.radius,
        enemy.radius*2,
        enemy.radius*2
    );

    // head
    ctx.fillStyle=enemy.color;
    ctx.fillRect(
        x-enemy.radius*.75,
        y-enemy.radius*1.45,
        enemy.radius*1.5,
        enemy.radius*.8
    );

    // eyes
    ctx.fillStyle="#111";

    ctx.fillRect(
        x-enemy.radius*.4,
        y-enemy.radius*1.2,
        5,
        5
    );

    ctx.fillRect(
        x+enemy.radius*.15,
        y-enemy.radius*1.2,
        5,
        5
    );

    if(enemy.boss){
        ctx.strokeStyle="#aaa";
        ctx.lineWidth=3;
        ctx.strokeRect(
            x-enemy.radius-5,
            y-enemy.radius-5,
            enemy.radius*2+10,
            enemy.radius*2+10
        );
    }

    // health bar
    const width=enemy.radius*2.4;

    ctx.fillStyle="#171717";
    ctx.fillRect(
        x-width/2,
        y-enemy.radius*1.9,
        width,
        6
    );

    ctx.fillStyle="#9b4444";
    ctx.fillRect(
        x-width/2,
        y-enemy.radius*1.9,
        width*(enemy.hp/enemy.maxHp),
        6
    );

    ctx.restore();
}

function drawHUD(){
    const p=state.player;
    const stats=derivedStats();

    ctx.fillStyle="#111";
    ctx.fillRect(20,H-58,310,30);

    ctx.fillStyle="#722d2d";
    ctx.fillRect(
        25,
        H-53,
        300*(p.hp/p.maxHp),
        20
    );

    ctx.strokeStyle="#888";
    ctx.strokeRect(20,H-58,310,30);

    ctx.fillStyle="#fff";
    ctx.font="bold 14px Arial";

    ctx.fillText(
        `HP ${Math.ceil(p.hp)} / ${p.maxHp}`,
        32,
        H-37
    );

    ctx.fillStyle="#aaa";
    ctx.font="13px Arial";

    ctx.fillText(
        `DMG ${stats.damage}   ARMOR ${stats.armor}`,
        350,
        H-39
    );

    ctx.fillText(
        "WASD Move   LMB Attack   RMB Ability   F Interact   I Inventory   C Character   M Map   U Updates   ESC Pause",
        20,
        H-12
    );
}

function renderGame(){
    ctx.clearRect(0,0,W,H);

    let sx=0;
    let sy=0;

    if(state.shake>0){
        sx=random(-state.shake,state.shake);
        sy=random(-state.shake,state.shake);
    }

    ctx.save();
    ctx.translate(sx,sy);

    drawBackground();
    drawDoorways();
    drawChest();

    for(const enemy of state.enemies){
        drawEnemy(enemy);
    }

    drawPlayer();

    ctx.restore();

    drawHUD();
}

/* =========================================================
   MAIN LOOP
   ========================================================= */

function loop(time){
    if(!state.lastTime){
        state.lastTime=time;
    }

    let dt=(time-state.lastTime)/1000;
    state.lastTime=time;

    dt=clamp(dt,0,.05);

    update(dt);

    if(state.gameStarted && state.screen==="game"){
        renderGame();
    }else if(state.gameStarted){
        /*
          Keep game canvas alive underneath menus.
        */
        renderGame();
    }else{
        ctx.clearRect(0,0,W,H);

        ctx.fillStyle="#08090c";
        ctx.fillRect(0,0,W,H);
    }

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   INITIALIZATION
   ========================================================= */

renderUpdates();
renderRarity();

console.log(
    "RODON "+GAME_VERSION+
    " loaded. Update Board contains "+
    UPDATES.length+
    " cumulative updates."
);
</script>
