<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rodon</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#080d0c;color:#f1dfb4;font-family:monospace}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}#ui{position:fixed;inset:0;pointer-events:none}#hp{position:absolute;top:20px;left:20px;width:250px;padding:10px;background:#101a18e8;border:2px solid #8b7043}#bar{height:12px;background:#401b20;margin-top:6px}#fill{height:100%;width:100%;background:#d04c50}#title{position:absolute;top:24px;width:100%;text-align:center;letter-spacing:4px}#tip{position:absolute;bottom:20px;width:100%;text-align:center}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#050807d9}.box{padding:35px;text-align:center;border:2px solid #a78a52;background:#111b19;box-shadow:0 0 60px #000}h1{font-size:56px;letter-spacing:10px;margin:0;color:#e0bd70}button{padding:12px 50px;background:#293936;color:#f5e5bd;border:1px solid #a78a52;font:inherit;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div id="hp">WARDEN OF RODON<br><div id="bar"><div id="fill"></div></div><span id="text">HP 100 / 100</span></div><div id="title">THE WHISPERING WARD</div><div id="tip">WASD: move · Click: attack · Defeat the goblins</div></div>
<div id="menu"><div class="box"><h1>RODON</h1><p>Explore the darkness.</p><button id="start">NEW GAME</button></div></div>
<script>
const c=document.querySelector("#game"),x=c.getContext("2d"),keys={},hero={x:480,y:330,hp:100},enemies=[{x:700,y:250,hp:40},{x:270,y:440,hp:40},{x:720,y:470,hp:40}];let W,H,on=false;
function size(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener("resize",size);size();
function r(a,b,w,h,z){x.fillStyle=z;x.fillRect(a,b,w,h)}
function world(){
 r(0,0,W,H,"#10251e");for(let a=0;a<W;a+=32)for(let b=0;b<H;b+=32){r(a,b,31,31,"#263d2c");r(a,b,31,2,"#152218")}
 r(0,H/2-30,W,64,"#75654b");for(let i=0;i<18;i++){let a=(i*91)%W,b=(i*143)%H;r(a-5,b,10,55,"#422d22");r(a-28,b-34,56,42,"#193022");r(a-18,b-52,36,25,"#345736")}
}
function sprite(o,hero=false){
 r(o.x-15,o.y+29,30,6,"#060807");if(hero){r(o.x-8,o.y-25,16,15,"#cb9270");r(o.x-13,o.y-31,26,8,"#3c271d");r(o.x-18,o.y-5,36,26,"#70848a");r(o.x-14,o.y+21,12,17,"#596b73");r(o.x+2,o.y+21,12,17,"#596b73");r(o.x+18,o.y-10,5,32,"#d9d9c9")}else{r(o.x-13,o.y-16,26,32,"#668d4e");r(o.x-20,o.y-13,40,10,"#89aa65");r(o.x-7,o.y-22,14,10,"#d8c575");r(o.x-5,o.y-18,3,3,"#f1bc59");r(o.x+3,o.y-18,3,3,"#f1bc59")}}
function draw(){world();enemies.filter(e=>e.hp>0).forEach(e=>sprite(e));sprite(hero,true);requestAnimationFrame(draw)}
function loop(){if(on){let a=(keys.d?1:0)-(keys.a?1:0),b=(keys.s?1:0)-(keys.w?1:0);hero.x+=a*3;hero.y+=b*3;hero.x=Math.max(25,Math.min(W-25,hero.x));hero.y=Math.max(40,Math.min(H-40,hero.y));enemies.forEach(e=>{if(e.hp>0&&Math.hypot(hero.x-e.x,hero.y-e.y)<35&&Math.random()<.02)hero.hp-=6});document.querySelector("#fill").style.width=Math.max(0,hero.hp)+"%";document.querySelector("#text").textContent="HP "+Math.max(0,hero.hp)+" / 100"}requestAnimationFrame(loop)}
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
c.onclick=()=>enemies.forEach(e=>{if(e.hp>0&&Math.hypot(hero.x-e.x,hero.y-e.y)<80)e.hp-=20});
document.querySelector("#start").onclick=()=>{on=true;document.querySelector("#menu").style.display="none"};draw();loop();
</script>
</body>
</html>
