<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rodon</title>
<style>
  *{box-sizing:border-box} body{margin:0;overflow:hidden;background:#090d10;color:#f1e5c7;font-family:monospace}
  canvas{width:100vw;height:100vh;display:block;image-rendering:pixelated}
  #hud{position:fixed;inset:0;pointer-events:none;text-shadow:2px 2px #000}
  .panel{background:#111a1de8;border:2px solid #746444;box-shadow:0 0 0 3px #080b0c;padding:10px}
  #stats{position:absolute;top:20px;left:20px;width:260px} #hp{height:12px;background:#3c1e24;border:1px solid #000;margin:6px 0}#hp i{display:block;height:100%;background:#ca4750;width:100%}
  #gold{position:absolute;right:25px;top:25px;color:#f0c765;font-size:17px}#place{position:absolute;top:30px;width:100%;text-align:center;letter-spacing:3px}
  #help{position:absolute;bottom:18px;left:20px;color:#c1c9bf;font-size:12px}#note{position:absolute;bottom:78px;width:100%;text-align:center;color:#f3d38b}
  #menu,#dead{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:#05080bd9;z-index:2}#dead{display:none;background:#24080ad9}
  .box{width:min(400px,90vw);padding:32px;text-align:center;background:#121a1c;border:2px solid #8d7546;box-shadow:0 0 60px #000}
  h1{font-size:60px;letter-spacing:10px;margin:0;color:#d9bd75}button{display:block;width:100%;padding:12px;margin-top:10px;background:#283334;color:#f1e1bb;border:1px solid #93805b;font:inherit;cursor:pointer;letter-spacing:2px}button:hover{background:#3f4b42}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="stats" class="panel">WARDEN OF RODON · LV <b id="lv">1</b><div id="hp"><i></i></div><span id="hptext">HP 100 / 100</span><span style="float:right">XP <b id="xp">0</b>/100</span></div>
  <div id="place">THE WHISPERING WARD</div><div id="gold">✦ <span id="coins">45</span> GOLD</div>
  <div id="note">WASD move · Click to attack · E near a chest</div>
  <div id="help">Defeat the creatures. Search the darkness.</div>
</div>
<div id="menu"><div class="box"><h1>RODON</h1><p>Explore the darkness. Find powerful gear.</p><button id="start">NEW GAME</button></div></div>
<div id="dead"><div class="box"><h1 style="color:#d64c4c;font-size:38px">YOU DIED</h1><button id="again">RETURN TO CHECKPOINT</button></div></div>

<script>
const c=document.querySelector("#game"),g=c.getContext("2d"),$=q=>document.querySelector(q);
let W,H,S=1,keys={},play=false,coins=45,xp=0,level=1;
let hero={x:470,y:340,hp:100,max:100,attack:0}, enemies=[],chest={x:175,y:185,open:false};

function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);S=Math.min(W/960,H/600)}
addEventListener("resize",resize);resize();

function spawn(){
  hero={x:470,y:340,hp:100,max:100,attack:0};
  enemies=[
    {name:"Goblin",x:680,y:220,hp:38,max:38,damage:9,color:"#668b4c"},
    {name:"Wolf",x:290,y:450,hp:30,max:30,damage:7,color:"#7d7060"},
    {name:"Goblin",x:740,y:475,hp:38,max:38,damage:9,color:"#668b4c"}
  ];
  chest.open=false;
}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
function background(){
  rect(0,0,W,H,"#10201c");g.save();g.scale(S,S);let w=W/S,h=H/S;
  for(let x=0;x<w;x+=32)for(let y=0;y<h;y++){rect(x,y,31,31,"#25382a");rect(x,y,31,2,"#111913")}
  rect(0,285,w,65,"#655845");rect(0,306,w,5,"#887759");
  for(let i=0;i<19;i++){let x=(i*79+25)%w,y=(i*139+24)%h;rect(x-5,y,10,58,"#402d23");rect(x-29,y-34,58,40,"#18281d");rect(x-22,y-49,44,30,"#29442f");rect(x-14,y-58,28,16,"#425c36")}
  for(let i=0;i<4;i++){let x=120+i*230,y=i%2?100:510;rect(x-3,y,6,24,"#351e17");rect(x-6,y-11,12,13,"#e47b37");rect(x-2,y-7,4,6,"#fff0ae")}
  g.globalAlpha=.15;for(let i=0;i<6;i++)rect((i*180+performance.now()/110)%w,60+i*86,150,18,"#cfdbd3");g.restore();
  let v=g.createRadialGradient(W/2,H/2,100,W/2,H/2,Math.max(W,H)*.7);v.addColorStop(0,"#0000");v.addColorStop(1,"#000b");g.fillStyle=v;g.fillRect(0,0,W,H);
}
function actor(o,isHero=false){
  g.save();g.scale(S,S);g.translate(o.x,o.y);
  g.fillStyle="#05060999";g.beginPath();g.ellipse(0,35,19,6,0,0,7);g.fill();
  if(isHero){
    rect(-13,-31,26,9,"#38241c");rect(-9,-26,18,16,"#cb9270");rect(-18,-5,36,26,"#768891");
    rect(-24,-4,7,20,"#d7ab80");rect(17,-4,7,20,"#d7ab80");rect(-18,15,36,5,"#29201e");
    rect(-14,21,12,17,"#596871");rect(2,21,12,17,"#596871");g.strokeStyle="#d4d7c9";g.lineWidth=6;g.beginPath();g.moveTo(20,6);g.lineTo(38,-18);g.stroke();
  }else if(o.name==="Wolf"){rect(-19,-5,38,19,"#766654");rect(-25,7,9,14,"#766654");rect(14,7,9,14,"#766654");rect(12,-14,17,15,"#c7af80")}
  else{rect(-13,-16,26,32,o.color);rect(-20,-13,40,10,"#8baa67");rect(-7,-21,14,9,"#d8c474");rect(-17,15,34,7,"#413327")}
  g.restore();
}
function draw(){
  background();g.save();g.scale(S,S);
  if(!chest.open){rect(chest.x-16,chest.y-12,32,24,"#3a2616");rect(chest.x-14,chest.y-10,28,20,"#9a672e");rect(chest.x-3,chest.y+2,6,7,"#f6d27a")}
  enemies.filter(e=>e.hp>0).forEach(e=>actor(e));actor(hero,true);g.restore();requestAnimationFrame(draw);
}
function update(){
  if(play){
    let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),l=Math.hypot(dx,dy)||1;
    hero.x=Math.max(35,Math.min(W/S-35,hero.x+dx/l*3));hero.y=Math.max(45,Math.min(H/S-40,hero.y+dy/l*3));hero.attack=Math.max(0,hero.attack-1);
    enemies.forEach(e=>{if(e.hp<=0)return;let d=Math.hypot(hero.x-e.x,hero.y-e.y);if(d<180){e.x+=(hero.x-e.x)/d*.45;e.y+=(hero.y-e.y)/d*.45}if(d<35&&Math.random()<.018)hurt(e.damage)});
    render();
  }requestAnimationFrame(update);
}
function strike(){
  if(!play||hero.attack)return;hero.attack=18;
  enemies.forEach(e=>{if(e.hp>0&&Math.hypot(hero.x-e.x,hero.y-e.y)<75){e.hp-=15;if(e.hp<=0){coins+=8;xp+=25;if(xp>=100){xp=0;level++;hero.max+=15;hero.hp=hero.max}}}});
}
function hurt(n){hero.hp-=n;if(hero.hp<=0){hero.hp=0;play=false;$("#dead").style.display="flex"}}
function interact(){if(!chest.open&&Math.hypot(hero.x-chest.x,hero.y-chest.y)<60){chest.open=true;coins+=45}}
function render(){$("#hptext").textContent=`HP ${Math.ceil(hero.hp)} / ${hero.max}`;$("#hp i").style.width=(hero.hp/hero.max*100)+"%";$("#coins").textContent=coins;$("#xp").textContent=xp;$("#lv").textContent=level}
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==="e")interact()});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);c.onclick=strike;
$("#start").onclick=()=>{spawn();play=true;$("#menu").style.display="none"};$("#again").onclick=()=>{spawn();play=true;$("#dead").style.display="none"};
spawn();draw();update();
</script>
</body>
</html>
